[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "psych-mas"
version = "0.7.3"
description = "Human-in-the-loop evidence governance for psychometric forensics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.137.0",
    "langgraph==1.2.5",
    "langgraph-cli[inmem]==0.4.29",
    "matplotlib==3.11.0",
    "networkx==3.6.1",
    "numpy==2.4.6",
    "pandas==3.0.3",
    "plotly==6.8.0",
    "pyvis==0.3.2",
    "python-docx==1.2.0",
    "python-dotenv==1.2.2",
    "redis==8.0.0",
    "reportlab==4.5.1",
    "requests==2.34.2",
    "rpy2==3.5.17; platform_system != 'Windows'",
    "streamlit==1.58.0",
    "streamlit-aggrid==1.2.1.post2",
    "uvicorn[standard]==0.49.0",
]

[tool.setuptools]
py-modules = ["graph", "ui", "mmls"]

[tool.setuptools.packages.find]
exclude = ["data", "R_Secmin"]
