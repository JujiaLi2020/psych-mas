name: Publish PsyMAS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=PsyMAS
            org.opencontainers.image.description=Human-in-the-loop psychometric forensics workbench
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and publish image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify published container runtime
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker run --rm ghcr.io/${{ github.repository }}:$version python -m psymas_cli --version
          docker run --rm ghcr.io/${{ github.repository }}:$version python -c "import zipfile; from psymas_ui.app_config import APP_VERSION, DEMO_EVALUATED_SNAPSHOT_PATH; assert APP_VERSION == '$version'; assert zipfile.ZipFile(DEMO_EVALUATED_SNAPSHOT_PATH).testzip() is None"

  windows-installer:
    needs: container
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify release and build CLI packages
        shell: pwsh
        run: |
          python scripts/verify_release.py
          python -m pip install --upgrade build
          python -m build
          $version = "${{ github.ref_name }}".TrimStart('v')
          python scripts/verify_release.py --wheel "dist/psych_mas-$version-py3-none-any.whl"
          Get-ChildItem dist/psych_mas-*.whl,dist/psych_mas-*.tar.gz | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\PsyMAS.iss'

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $name = "PsyMAS-Setup-Windows-${{ github.ref_name }}.exe"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content "dist/$name.sha256" -Encoding ascii

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --title "PsyMAS ${{ github.ref_name }}" --generate-notes
          }
          $version = "${{ github.ref_name }}".TrimStart('v')
          gh release upload "${{ github.ref_name }}" "dist/psych_mas-$version-py3-none-any.whl" "dist/psych_mas-$version-py3-none-any.whl.sha256" "dist/psych_mas-$version.tar.gz" "dist/psych_mas-$version.tar.gz.sha256" "dist/PsyMAS-Setup-Windows-${{ github.ref_name }}.exe" "dist/PsyMAS-Setup-Windows-${{ github.ref_name }}.exe.sha256" --clobber

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: PsyMAS-Setup-Windows-${{ github.ref_name }}
          path: |
            dist/PsyMAS-Setup-Windows-${{ github.ref_name }}.exe
            dist/PsyMAS-Setup-Windows-${{ github.ref_name }}.exe.sha256
