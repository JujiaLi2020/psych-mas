name: Refresh PsyMAS release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to refresh
        required: true
        default: v0.7.7

permissions:
  contents: write

jobs:
  windows-and-python-assets:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build Python CLI distributions
        shell: pwsh
        run: |
          python -m pip install --upgrade build
          python -m build
          Get-ChildItem dist\psych_mas-*.whl,dist\psych_mas-*.tar.gz | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\PsyMAS.iss'

      - name: Generate installer checksum
        shell: pwsh
        run: |
          $name = "PsyMAS-Setup-Windows-${{ inputs.tag }}.exe"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content "dist/$name.sha256" -Encoding ascii

      - name: Upload refreshed assets to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag }}" `
            "dist/psych_mas-0.7.7-py3-none-any.whl" `
            "dist/psych_mas-0.7.7-py3-none-any.whl.sha256" `
            "dist/psych_mas-0.7.7.tar.gz" `
            "dist/psych_mas-0.7.7.tar.gz.sha256" `
            "dist/PsyMAS-Setup-Windows-${{ inputs.tag }}.exe" `
            "dist/PsyMAS-Setup-Windows-${{ inputs.tag }}.exe.sha256" `
            --clobber
