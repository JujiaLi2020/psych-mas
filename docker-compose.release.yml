name: psymas

services:
  backend:
    image: ghcr.io/jujiali2020/psych-mas:${PSYMAS_IMAGE_TAG:-0.7.6}
    environment:
      PORT: "8000"
      PSYMAS_JOB_DIR: /tmp/psymas_detect_jobs
      PSYMAS_GUNICORN_WORKERS: "1"
      PYTHONWARNINGS: ignore::UserWarning:rpy2.rinterface
      R_ENABLE_JIT: "0"
    env_file:
      - path: .env
        required: false
    volumes:
      - psymas_jobs:/tmp/psymas_detect_jobs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s
    restart: unless-stopped

  ui:
    image: ghcr.io/jujiali2020/psych-mas:${PSYMAS_IMAGE_TAG:-0.7.6}
    ports:
      - "${PSYMAS_UI_PORT:-8501}:8501"
    environment:
      PORT: "8501"
      PSYMAS_BACKEND_URL: http://backend:8000
      STREAMLIT_SERVER_HEADLESS: "true"
    env_file:
      - path: .env
        required: false
    volumes:
      - ${PSYMAS_DATA_DIR:-./data/output}:/app/data/output
    command: ["sh", "scripts/run_ui_railway.sh"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  psymas_jobs:
