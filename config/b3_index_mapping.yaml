version: 2
name: PsyMAS evidence rulebook
source_csv: config/rulebook_index.csv
description: >-
  Canonical rulebook for translating package outputs into traceable evidence.
  Raw indices remain available for audit, but B3 counts family-level eligible
  signals rather than correction variants or raw flag counts.

defaults:
  alpha: 0.05
  unit_of_count: family_level_signal
  missing_flag_policy: do_not_count
  uncalibrated_threshold_policy: retain_for_display_and_audit
  auxiliary_policy: retain_for_context_and_localization
  misconduct_decision: human_only

domain_policy:
  RT:
    label: Response-Time Evidence
    priority_role: primary_scenario
    eligible_functions: [detect_rg]
    eligible_methods: [CT, CUMP, NT]
    excluded_methods: [RTE, RTF, VI, VITP, unmotivated]
    rationale: >-
      These methods directly operationalize rapid or atypical response-time
      behavior. Detect_pm timing statistics remain MF because they test
      parametric person fit, not an independent rapid-guessing scenario.
  PK:
    label: Preknowledge Evidence
    priority_role: primary_scenario
    eligible_functions: [detect_pk]
    rationale: >-
      Eligible package-returned preknowledge flags are summarized by distinct
      preknowledge families and interpreted with exposure or compromised-item
      information when available.
  TP:
    label: Tampering / Answer-Change Evidence
    priority_role: primary_scenario
    eligible_functions: [detect_tt]
    rationale: >-
      Answer-change outputs are collapsed by family. Correction variants are
      not independent evidence; at most one signal is counted per family.
  MF:
    label: Misfit Evidence
    priority_role: supporting_only
    eligible_functions: [detect_pm, detect_nm]
    eligible_methods: [ECI2_S, ECI4_S, L_S, L_R, L_T, L_RT, L_ST, Q_RT, Q_ST]
    rationale: >-
      Person-fit statistics support interpretation of a primary scenario but
      do not create an independent scenario or cross-domain convergence.
      Score, response, time, and joint data bases are retained as metadata.
  SIM:
    label: Similarity Evidence
    priority_role: context_only
    eligible_functions: [detect_ac, detect_as]
    rationale: >-
      Similarity and copying outputs remain visible for pair-level review.
      They do not enter B3 or priority until a prespecified pairwise rule and
      calibration study are supplied.
  CP:
    label: Change-Pattern Evidence
    priority_role: context_only
    eligible_functions: [detect_cp]
    rationale: >-
      Change-point locations are localization evidence. They do not enter B3
      or priority without a separately validated change-pattern rule.

family_policy:
  correction_variants:
    retain_raw_outputs: true
    count_one_signal_per_family: true
    allowed_primary_variants:
      detect_tt:
        tt_EDI_R: CO
        tt_EDI_SD: CO
    non_primary_treatment: sensitivity_only
  detect_pm:
    domain: MF
    role: supporting
    data_basis_field: data_basis
    data_basis_values: [score, response, time, response_time, score_time]
    aggregation: one_signal_per_base_statistic_family
  detect_rg:
    domain: RT
    role: primary
    aggregation: one_signal_per_method_family

evidence_use:
  Evidence Flag:
    enters_b3: true
    requirement: package_returned_flag_or_approved_rule_flag
  Calibration Required:
    enters_b3: false
    requirement: approved_external_cutoff_or_calibration_record
  Support Only:
    enters_b3: false
    purpose: contextual_or_pair_level_interpretation
  Display Only:
    enters_b3: false
    purpose: localization_visualization_or_audit

b3_domain_strength_rules:
  B3-00:
    condition: required_data_unavailable
    strength: unavailable
  B3-01:
    condition: no_eligible_primary_or_supporting_family_signal
    strength: none
  B3-02:
    condition: one_eligible_supporting_family_signal_and_no_primary
    strength: weak
  B3-03:
    condition: one_or_more_eligible_primary_family_signals_and_no_supporting
    strength: moderate
  B3-04:
    condition: two_or_more_eligible_supporting_family_signals_and_no_primary
    strength: moderate
  B3-05:
    condition: eligible_primary_and_supporting_family_signals
    strength: strong

domain_overrides:
  SIM:
    b3_status: context_only
    priority_contribution: none
  CP:
    b3_status: localization_only
    priority_contribution: none
  MF:
    b3_status: supporting_only
    priority_contribution: strengthening_only

priority_policy:
  primary_domains: [RT, PK, TP]
  supporting_domains: [MF]
  context_domains: [SIM, CP]
  rule: >-
    Priority is derived from eligible primary-domain strength and case
    configuration. Supporting MF evidence may strengthen a review concern but
    cannot create a scenario by itself. SIM and CP are not priority inputs in
    the current rulebook.
  human_review_required: true
  misconduct_determination: prohibited

reporting_policy:
  required_trace: [function, method, index, aggregation_family, domain, rule, source_columns]
  required_disclosures: [missing_evidence, calibration_status, human_adjudication_boundary]
  llm_allowed: [summarize_governed_evidence, explain_index_patterns, draft_cautious_review_language]
  llm_prohibited: [compute_flags, change_thresholds, create_evidence, infer_intent, determine_misconduct, recommend_sanctions]
