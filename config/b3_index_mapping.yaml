evidence_policy:
  principle: B3 consumes only index-level flags. Raw statistic-only indices without
    a calibrated threshold are display/audit outputs, not evidence.
  package_pvalue_flag: eligible when p-value/flag exists and alpha rule is configured
  external_threshold_required: eligible only when config/index_thresholds.yaml marks
    B3_eligible=true
  rt_threshold_flag: eligible when aberrance threshold method returns response-level/person-level
    flags
  descriptive_or_auxiliary: excluded from B3 unless promoted by a documented program
    rule
governance_notes:
  domain_assignment_principle: Assign evidence domain by the substantive behavior
    tested by the index, not by data source alone; detect_pm time and joint response-time
    variants remain MF person-fit evidence, while detect_rg supplies RT scenario evidence.
  family_signal_principle: Raw correction variants are retained for audit, but each
    aggregation_family contributes at most one signal to domain profiling.
