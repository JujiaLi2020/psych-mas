version: 1
name: PsyMAS B3 index mapping
source_csv: manuscript/rulebook_index.csv
description: Maps aberrance/PsyMAS indices into Appendix Table B3 domain-level evidence
  strength analysis.
defaults:
  alpha: 0.05
  missing_flag_policy: do_not_count
  descriptive_only_policy: exclude_from_B3
  auxiliary_policy: audit_only
B3_domain_strength_rules:
  B3-00:
    condition: required_data_unavailable
    strength: unavailable
  B3-01:
    condition: no_primary_or_supporting_flags
    strength: none
  B3-02:
    condition: one_supporting_no_primary
    strength: weak
  B3-03:
    condition: one_or_more_primary_no_supporting
    strength: moderate
  B3-04:
    condition: multiple_supporting_no_primary
    strength: moderate
  B3-05:
    condition: primary_and_supporting
    strength: strong
domains:
  SIM:
    preferred_primary:
    - OMG_S
    - OMG_ST
    fallback_primary:
    - GBT_S
    - OMG_S
    supporting:
    - GBT_R
    - GBT_RT
    - GBT_S
    - GBT_ST
    - M4_R
    - M4_S
    - OMG_R
    - OMG_RT
    - WOMG_R
    - WOMG_S
    auxiliary:
    - pair_count
    descriptive: []
  CP:
    auxiliary:
    - cp_location
  MF:
    preferred_primary: []
    fallback_primary: []
    supporting:
    - A_S
    - C_S
    - D_S
    - ECI2_S_NO / CF / CS / EW / TS / TSCF / TSCS / TSEW
    - ECI4_S_NO / CF / CS / EW / TS / TSCF / TSCS / TSEW
    - E_S
    - G_S
    - L_R_NO / CF / CS / EW / TS / TSCF / TSCS / TSEW
    - MC_S
    - NC_S
    - PC_S
    - Q_ST_NO / CF / CS / EW / TS / TSCF / TSCS / TSEW
    - U1_S
    - U3_S
    - L_ST_NO___CF___CS___EW___TS___TSCF___TSCS___TSEW
    - L_S_NO___CF___CS___EW___TS___TSCF___TSCS___TSEW
    - ECI2_S_NO___CF___CS___EW___TS___TSCF___TSCS___TSEW
    - ECI4_S_NO___CF___CS___EW___TS___TSCF___TSCS___TSEW
    - L_R_NO___CF___CS___EW___TS___TSCF___TSCS___TSEW
    - L_T
    - Q_ST_NO___CF___CS___EW___TS___TSCF___TSCS___TSEW
    - Q_RT_NO___CF___CS___EW___TS___TSCF___TSCS___TSEW
    - L_RT_NO___CF___CS___EW___TS___TSCF___TSCS___TSEW
    - KL_T
    auxiliary: []
    descriptive: []
  RT:
    preferred_primary: []
    fallback_primary: []
    supporting:
    - L_RT_NO / CF / CS / EW / TS / TSCF / TSCS / TSEW
    - Q_RT_NO / CF / CS / EW / TS / TSCF / TSCS / TSEW
    auxiliary:
    - RTF
    - unmotivated
    descriptive:
    - VI
    - VITP
  PK:
    preferred_primary:
    - L_ST
    fallback_primary:
    - L_S
    supporting:
    - LR_S
    - L_T
    - ML_S
    - S_S
    - W_S
    - W_T
    auxiliary: []
    descriptive: []
  TP:
    preferred_primary:
    - EDI_SD_CO
    fallback_primary: []
    supporting:
    - EDI_R_CO
    - GBT_R
    - GBT_SD
    - L_R
    - L_SD
    auxiliary: []
    descriptive: []
B3_inputs_by_domain:
  SIM:
    preferred_primary:
    - detect_ac.OMG_S
    - detect_as.OMG_ST
    fallback_primary:
