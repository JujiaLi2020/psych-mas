- id: detect_ac.OMG_S
  function: detect_ac
  method: OMG_S
  domain: SIM
  role: preferred_primary
  feeds_B3: true
  feed_policy: 'yes'
  package_output:
  - stat
  - pval
  - flag
  package_flag: 'yes'
  flag_type: package_pvalue_flag
  default_rule: pval <= alpha
  threshold_source: package alpha
  columns:
    stat:
    - ac_OMG_S
    pvalue:
    - ac_OMG_S_pval
    flag:
    - ac_OMG_S_pval_Flag
  threshold_rule:
    type: package_pvalue
    operator: <=
    value: alpha
    source: package alpha
  notes: Conditional omega, score-based source-copier statistic
  evidence_use: may_feed_B3_as_package_pvalue_flag
