  method: EDI_SD_NO
  domain: TP
  role: preferred_primary
  feeds_B3: false
  feed_policy: sensitivity_only
  aggregation_family: tt_EDI_SD
  correction_variant: false
  data_basis: score
  variant_treatment: sensitivity_only
  package_output:
  - stat
  - pval
  - flag
  package_flag: 'yes'
  flag_type: package_pvalue_flag
  default_rule: pval <= alpha
  threshold_source: package alpha
  columns:
    stat:
    - tt_EDI_SD_NO
    pvalue:
    - tt_EDI_SD_NO_pval
    flag:
    - tt_EDI_SD_NO_pval_Flag
  threshold_rule:
    type: package_pvalue
    operator: <=
    value: alpha
    source: package alpha
  notes: Score-distractor erasure detection; NO correction retained for sensitivity/audit
    only.
  evidence_use: sensitivity_or_audit_only
